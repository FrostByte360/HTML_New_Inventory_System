<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product List</title>
    <link rel="stylesheet" href="mystyle.css">
</head>
<body style="padding: 20px; background: transparent;">

    <h2>Product Catalog List</h2>
    <p style="margin-bottom: 15px;">A live directory view highlighting all item variants inside active reserves.</p>
    
    <table>
        <thead>
            <tr>
                <th>Product ID</th>
                <th>Product Name</th>
                <th>Category</th>
                <th>Quantity</th>
                <th>Unit Price</th>
                <th style="width: 100px; text-align: center;">Actions</th>
            </tr>
        </thead>
        <tbody id="productTableBody">
            </tbody>
    </table>

    <script src="script.js"></script>
    <script>
        // Trigger the row rendering immediately when this specific page loads
        if (typeof renderProductList === "function") {
            renderProductList();
        }
    </script>
</body>
</html>
