<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory System Dashboard</title>
    <link rel="stylesheet" href="mystyle.css">
    <script src="script.js"></script>
    <style>
        /* Small CSS addition to make sure the iframe fills their exact layout */
        .content {
            padding: 0 !important; /* Removes default padding so iframe is full screen */
            height: calc(100vh - 20px); /* Adjust based on your top bar if needed */
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background-color: transparent;
        }
    </style>
</head>
<body>

    <div id="inventoryPage">

        <div class="sidebar" id="sidebar">
            <div class="logo">
                <button class="toggle-btn" onclick="toggleSidebar()">☰</button>
                Inventory
            </div>

            <div class="menu">

                <div class="menu-item">
                    <a href="overview.html" target="main-display" class="menu-btn" style="text-decoration: none; display: block; text-align: left;">
                        📊 Dashboard
                    </a>
                </div>

                <div class="menu-item">
                    <button class="menu-btn" onclick="toggleMenu('productMenu')">
                        📦 Products ▼
                    </button>
                    <div class="submenu" id="productMenu">
                        <a href="product-list.html" target="main-display">Product List</a>
                        <a href="categories.html" target="main-display">Categories</a>
                        <a href="add-product.html" target="main-display">Add Product</a>
                    </div>
                </div>

                <div class="menu-item">
                    <button class="menu-btn" onclick="toggleMenu('orderMenu')">
                        🚚 Orders ▼
                    </button>
                    <div class="submenu" id="orderMenu">
                        <a href="pending-orders.html" target="main-display">Pending Orders</a>
                        <a href="in-transit.html" target="main-display">In Transit Orders</a>
                        <a href="delivered.html" target="main-display">Delivered Orders</a>
                    </div>
                </div>

                <div class="menu-item">
                    <button class="menu-btn" onclick="toggleMenu('stockMenu')">
                        🏭 Stock ▼
                    </button>
                    <div class="submenu" id="stockMenu">
                        <a href="current-stock.html" target="main-display">Current Stock</a>
                        <a href="low-stock.html" target="main-display">Low Stock</a>
                        <a href="stock-history.html" target="main-display">Stock History</a>
                    </div>
                </div>

                <div class="menu-item">
                    <button class="menu-btn" onclick="toggleMenu('transactionMenu')">
                        💳 Transactions ▼
                    </button>
                    <div class="submenu" id="transactionMenu">
                        <a href="stock-in.html" target="main-display">Stock In</a>
                        <a href="stock-out.html" target="main-display">Stock Out</a>
                        <a href="transaction-records.html" target="main-display">Transaction Records</a>
                    </div>
                </div>

                <div class="menu-item">
                    <button class="menu-btn" onclick="toggleMenu('trackingMenu')">
                        📍 Tracking ▼
                    </button>
                    <div class="submenu" id="trackingMenu">
                        <a href="delivery-tracking.html" target="main-display">Delivery Tracking</a>
                        <a href="delivery-history.html" target="main-display">Delivery History</a>
                    </div>
                </div>

                <div class="menu-item">
                    <button class="menu-btn" onclick="toggleMenu('adminMenu')">
                        👤 Admin ▼
                    </button>
                    <div class="submenu" id="adminMenu">
                        <a href="profile.html" target="main-display">Profile</a>
                        <a href="change-password.html" target="main-display">Change Password</a>
                    </div>
                </div>

                <div class="menu-item">
                    <button class="menu-btn" onclick="logout()">
                        🚪 Logout
                    </button>
                </div>

            </div>
        </div>

        <div class="content">
            <iframe src="overview.html" name="main-display" title="Inventory Content"></iframe>
        </div>

    </div>
</body>
</html>
